# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# This runs `R CMD check`, which includes the testthat suite. It exists because
# a broken .Rd file once reached the shipped tree and made the package
# uninstallable from a clean checkout -- `tools::parse_Rd()` runs inside
# `R CMD check`, so this job would have caught it on the commit that introduced
# it. Note that `--no-manual` skips the PDF manual, not the Rd parse.
on:
  push:
    branches: [main, master, emilia_review]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}
          # The package's hard dependencies include Seurat and scCustomize,
          # which are slow to resolve off Linux binaries. Add macOS/Windows here
          # if the package is ever distributed beyond the lab's Linux machines.

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      # Vignettes are R Markdown, so the build step needs pandoc. Without it
      # `R CMD build` fails before any check runs.
      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
